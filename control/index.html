<!doctype html>
<meta charset="utf-8">
<title>imgen</title>
<style>
  body { font: 15px system-ui; max-width: 60rem; margin: 2rem auto;
         padding: 0 1rem; background: #111; color: #eee; }
  h1 { margin: 0 0 1rem; font-size: 1.4rem; }
  label { display: block; margin: .6rem 0 .2rem; color: #aaa; }
  input, textarea, button { font: inherit; width: 100%; padding: .4rem;
         background: #1c1c1c; color: #eee; border: 1px solid #333;
         border-radius: 3px; }
  .row { display: flex; gap: .6rem; }
  .row > * { flex: 1; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }

  .gpu { display: flex; align-items: center; gap: .75rem;
         border: 1px solid #333; border-radius: 4px; padding: .7rem .9rem;
         margin-bottom: 1.2rem; }
  .gpu .state { font-weight: 600; }
  .gpu .work { color: #aaa; flex: 1; }
  .gpu button { width: auto; padding: .35rem 1rem; }
  .dot { width: .7rem; height: .7rem; border-radius: 50%;
         background: #666; flex: none; }
  .dot.on { background: #3ddc84; }
  .dot.busy { background: #e8b339; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  #go { margin-top: 1rem; }
  #gallery { display: grid; gap: .5rem; margin-top: 1.5rem;
         grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
  #gallery img { width: 100%; display: block; cursor: pointer;
         border-radius: 3px; }
  .note { color: #888; font-size: .85em; }
  .error { color: #f66; white-space: pre-wrap; }

  dialog { background: #1a1a1a; color: #eee; border: 1px solid #333;
           border-radius: 6px; max-width: 46rem; width: 92%; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog img { width: 100%; display: block; }
  .detail { padding: 1rem; }
  .detail dl { display: grid; grid-template-columns: 8rem 1fr;
               gap: .3rem .8rem; margin: 0 0 1rem; font-size: .9em; }
  .detail dt { color: #888; }
  .detail dd { margin: 0; word-break: break-word; }
  .detail .row button, .detail .row a { width: auto; }
  .detail a { display: inline-block; padding: .35rem 1rem; border: 1px solid #333;
              border-radius: 3px; color: #eee; text-decoration: none;
              background: #1c1c1c; }
  .danger { border-color: #833; color: #f88; }
</style>

<h1>imgen</h1>

<div class="gpu">
  <span id="dot" class="dot"></span>
  <span id="state" class="state">checking…</span>
  <span id="work" class="work"></span>
  <button id="toggle" disabled>…</button>
</div>

<label>Prompt</label>
<textarea id="prompt" rows="4"></textarea>
<p id="tokens" class="note"></p>

<label>Negative prompt</label>
<input id="negative_prompt">

<div class="row">
  <div><label>Seed</label><input id="seed" type="number" value="0"></div>
  <div><label>Steps</label><input id="steps" type="number"></div>
  <div><label>Guidance</label><input id="guidance" type="number" step=".1"></div>
</div>
<div class="row">
  <div><label>Width</label><input id="width" type="number"></div>
  <div><label>Height</label><input id="height" type="number"></div>
  <div><label>Best of</label><input id="count" type="number"></div>
</div>

<button id="go">Generate</button>
<p id="status" class="note"></p>
<p id="error" class="error"></p>
<div id="gallery"></div>

<dialog id="detail">
  <img id="detail-img">
  <div class="detail">
    <dl id="detail-fields"></dl>
    <div class="row">
      <a id="detail-download" download>Download</a>
      <button id="detail-delete" class="danger">Delete</button>
      <button id="detail-close">Close</button>
    </div>
  </div>
</dialog>

<script>
const defaults = __DEFAULTS__;
const fields = ["negative_prompt", "seed", "steps", "guidance",
                "width", "height", "count"];
const $ = id => document.getElementById(id);
const say = (id, text) => $(id).textContent = text;

for (const [key, value] of Object.entries(defaults))
  if ($(key)) $(key).value = value;

// The negative prompt is the one field worth carrying between visits.
const REMEMBERED = "imgen.negative_prompt";
const kept = localStorage.getItem(REMEMBERED);
if (kept !== null) $("negative_prompt").value = kept;
$("negative_prompt").oninput = () =>
  localStorage.setItem(REMEMBERED, $("negative_prompt").value);

async function call(path, body, method) {
  const options = body || method
    ? {method: method || "POST",
       headers: body ? {"Content-Type": "application/json"} : {},
       body: body ? JSON.stringify(body) : undefined}
    : {};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(`${data.error}: ${data.message}`);
  return data;
}

// --- GPU ---------------------------------------------------------------
const POLL_MS = 5000;
const sleep = ms => new Promise(done => setTimeout(done, ms));

let running = false;   // the VM is up
let busy = false;      // the box is mid-generation
let settling = false;  // the VM is starting or stopping
let pending = false;   // a request from this page is still outstanding
let watching = false;

// Anything that is neither off nor serving is a transition; the button
// stays out of the way until it settles.
function show(state, loaded, generating) {
  const off = state === "TERMINATED" || state === "SUSPENDED";
  running = state === "RUNNING";
  busy = Boolean(generating);
  settling = !off && !(running && loaded);
  const label = off ? "off"
    : running && loaded ? "running"
    : running ? "starting — loading model"
    : state === "STOPPING" || state === "SUSPENDING" ? "stopping"
    : "starting";
  $("dot").className = "dot" + (settling ? " busy" : running ? " on" : "");
  say("state", `GPU ${label}`);
  say("work", running && loaded ? (busy ? "· generating" : "· idle") : "");
  say("toggle", running ? "Stop" : "Start");
  $("toggle").disabled = settling;
}

async function power() {
  const data = await call("/power");
  show(data.state, Boolean(data.token_limit), data.busy);
  if (data.token_limit)
    say("tokens", `prompts are cut past ${data.token_limit} tokens`);
}

$("toggle").onclick = async () => {
  const on = !running;
  $("toggle").disabled = true;
  say("state", on ? "GPU starting" : "GPU stopping");
  $("dot").className = "dot busy";
  await call("/power", {on});
  settling = true;
  watch();
};

async function refresh() {
  await power();
  await gallery();
}

// Poll only while something is moving. A settled page asks for nothing,
// but a generate request can outlive its own connection, so the loop
// keeps going on the server's own busy flag rather than on this
// page's request surviving.
async function watch() {
  if (watching) return;
  watching = true;
  try {
    do {
      await sleep(POLL_MS);
      await refresh();
    } while (pending || busy || settling);
  } finally {
    watching = false;
  }
}

// --- generate ----------------------------------------------------------
$("go").onclick = async () => {
  say("error", "");
  say("status", running ? "generating…" : "starting the GPU, then generating…");
  pending = true;
  watch();
  try {
    const body = {prompt: $("prompt").value};
    for (const f of fields) body[f] = $(f).value;
    const data = await call("/generate", body);
    say("status", `${data.images.length} images in ${data.seconds}s ` +
        `(seeds ${data.images.map(i => i.seed).join(", ")})`);
    if (data.tokens > data.token_limit)
      say("tokens", `prompt cut: ${data.tokens} of ${data.token_limit} tokens`);
    await gallery();
  } catch (e) {
    say("status", "");
    say("error", e.message);
  } finally {
    pending = false;
  }
};

// --- gallery and details -----------------------------------------------
const LABELS = {created: "Date", prompt: "Prompt",
                negative_prompt: "Negative", seed: "Seed", steps: "Steps",
                guidance: "Guidance", size: "Size", model: "Model",
                revision: "Revision"};

function open_detail(image) {
  $("detail-img").src = `/image/${image.name}`;
  $("detail-download").href = `/image/${image.name}`;
  $("detail-download").setAttribute("download", image.name);
  $("detail-fields").innerHTML = Object.keys(LABELS)
    .filter(k => image[k])
    .map(k => `<dt>${LABELS[k]}</dt><dd>${escape_html(
      k === "created" ? new Date(image[k]).toLocaleString() : image[k])}</dd>`)
    .join("");
  $("detail-delete").onclick = async () => {
    if (!confirm(`Delete ${image.name}?`)) return;
    await call(`/image/${image.name}`, null, "DELETE");
    $("detail").close();
    gallery();
  };
  $("detail").showModal();
}

function escape_html(text) {
  const node = document.createElement("span");
  node.textContent = text;
  return node.innerHTML;
}

let shown = "";

async function gallery() {
  const data = await call("/gallery");
  // Rebuilding unconditionally would reload every thumbnail each tick.
  const signature = data.images.map(i => i.name).join("|");
  if (signature === shown) return;
  shown = signature;
  $("gallery").innerHTML = "";
  for (const image of data.images) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = `/image/${image.name}`;
    img.title = image.prompt || image.name;
    img.onclick = () => open_detail(image);
    $("gallery").append(img);
  }
}

$("detail-close").onclick = () => $("detail").close();

// A page left open goes quiet; catch up when it is looked at again.
window.addEventListener("focus", refresh);

refresh();
</script>
